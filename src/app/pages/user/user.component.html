<ion-header [translucent]="true" class="">
  <ion-toolbar>
    <ion-buttons slot="start" class="color-header">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <div class="main-div-header color-header">
      <h5>
        Saldo: <strong>{{ user?.saldo }}</strong> | Premios
        <strong>{{ user?.bonus }}</strong>
      </h5>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="!loading; else loadingTemplate">
  <div class="body-header">
    <h2><strong>Banca</strong></h2>
  </div>
  <div class="sub-container">
    <div class="sub-div border-radius">
      <div class="sub-container-main">
        <div class="sub-tittle">
          <h5>Sinpe Banca</h5>
        </div>
        <div class="sub-container-div">
          <div class="icon-column">
            <ion-icon name="person-circle-outline"></ion-icon>
          </div>
          <div class="info-column">
            {{ userInfo.sinpeBanca }}
          </div>
        </div>
      </div>
      <div class="sub-container-main">
        <div class="sub-tittle">
          <h5>A nombre de</h5>
        </div>
        <div class="sub-container-div">
          <div class="icon-column">
            <ion-icon name="arrow-redo-outline"></ion-icon>
          </div>
          <div class="info-column-email">
            {{ userInfo.nameBanca }}
          </div>
        </div>
      </div>
      <!---->
      <div class="sub-container-main">
        <div class="sub-tittle">
          <h5>Servicio al Cliente</h5>
        </div>
        <div class="sub-container-div">
          <div class="icon-column">
            <ion-icon style="color: green;" class="whatsapp-icon" name="logo-whatsapp" (click)="sendWhatsappRequest()"></ion-icon>
          </div>
          <div class="info-column">
            {{ bancaInfo.whatsapp }}
          </div>
        </div>
      </div>
      <!---->
    </div>
  </div>
  <div class="body-header">
    <h2><strong>Usuario</strong></h2>
  </div>
  <div class="sub-container">
    <div class="sub-div border-radius">
      <div class="sub-container-main">
        <div class="sub-tittle">
          <h5>Tu Sinpe</h5>
        </div>

        <div class="sub-container-div">
          <div class="icon-column">
            <ion-icon name="phone-portrait-outline"></ion-icon>
          </div>
          <div class="info-column">{{ userInfo.sinpeUser }}</div>
        </div>
      </div>
      <div class="sub-container-main">
        <div class="sub-tittle">
          <h5>Tu Cuenta</h5>
        </div>

        <div class="sub-container-div">
          <div class="icon-column">
            <ion-icon name="cash-outline"></ion-icon>
          </div>
          <div class="info-column-account">{{ userInfo.acountUser }}</div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
<ng-template #loadingTemplate>
  <div class="main">
    <ion-spinner name="dots" color="tertiary"></ion-spinner>
  </div>
</ng-template>
